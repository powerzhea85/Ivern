name: Temporary Wave 4C Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/temporary-wave4c-build.yml'
      - 'ci/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/temporary-wave4c-build.yml'
      - 'ci/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORKSPACE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-158c-81f4-8292-4c917e093bc5/raw?se=2026-07-19T05:34:41Z&sp=r&sv=2026-02-06&sr=b&scid=0831d59c-55d0-5740-a11b-d07e629b2a77&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-19T00:14:29Z&ske=2026-07-21T00:14:29Z&sks=b&skv=2026-02-06&sig=rP2X0M9Jc7KOwaZZY/p/9Lo5bkkuUZteQ8KRv/8k9ro%3D"

    steps:
      - name: Checkout CI files
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download verified workspace
        run: |
          curl --fail --location --retry 3 "$WORKSPACE_URL" --output workspace.zip
          test "$(sha256sum workspace.zip | cut -d' ' -f1)" = "702b0691b67856168420db0ac045518d41beb682a440c2a466ab8a251850fcf2"
          mkdir work
          unzip -q workspace.zip -d work
          git -C work init

      - name: Apply complete Wave 4B integration
        run: |
          cat ci/wave4bparts/part*.txt | tr -d '\r\n' > work/tools/wave4b-silentaim.patch.gz.b64
          cd work
          python3 ../ci/apply_wave4b.py

      - name: Reconstruct and apply Wave 4C
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess

          root = pathlib.Path('work')
          for source_root in (root / 'src' / 'BenjaminMenu', root / 'docs'):
              for path in source_root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.cs', '.csproj', '.md'}:
                      path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))

          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in sorted(pathlib.Path('ci/wave4cparts').glob('part*.txt')))
          decoded = gzip.decompress(base64.b64decode(encoded))
          actual = hashlib.sha256(decoded).hexdigest()
          expected = '727c20e166f60c6b813064f84c962e035874d80d03edffaef53036ce32c7bcae'
          if actual != expected:
              raise RuntimeError(f'Wave 4C patch hash mismatch: {actual}')
          pathlib.Path('wave4c.patch').write_bytes(decoded)
          subprocess.check_call(['git', 'apply', '--check', '--verbose', '--whitespace=nowarn', '../wave4c.patch'], cwd=root)
          subprocess.check_call(['git', 'apply', '--verbose', '--whitespace=nowarn', '../wave4c.patch'], cwd=root)
          PY

      - name: Build Wave 4C DLL
        run: |
          dotnet build work/src/BenjaminMenu/BenjaminMenu.csproj \
            --configuration Release \
            /p:SourceRevisionId=${{ github.sha }} \
            /p:ContinuousIntegrationBuild=true 2>&1 | tee build.log

      - name: Assemble QA package
        run: |
          mkdir artifact
          cp work/src/BenjaminMenu/bin/Release/BenjaminMenu.dll artifact/BenjaminMenu-QA-Wave4C-Aimbot.dll
          cp work/docs/WAVE_4C_AIMBOT_TEST.md artifact/WAVE_4C_AIMBOT_TEST.md
          sha256sum artifact/BenjaminMenu-QA-Wave4C-Aimbot.dll > artifact/BenjaminMenu-QA-Wave4C-Aimbot.sha256.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wave4C-Build-Diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Wave 4C package
        uses: actions/upload-artifact@v4
        with:
          name: BenjaminMenu-QA-Wave4C-Aimbot
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
